[sensor]
# Sensor type: ld2410 (mmWave UART) or gpio (PIR / LD2410 OUT pin)
type = ld2410

# --- LD2410 settings (type = ld2410) ---
# Serial port for the LD2410 sensor UART (TX/RX)
serial_port = /dev/ttyS0

# Baud rate (LD2410 default is 256000)
baud_rate = 256000

# Maximum detection distance in cm (0 = use sensor's full range).
# Set this to limit detection to your desk area (e.g. 100 for ~1 m).
max_distance = 0

# --- GPIO settings (type = gpio) ---
# BCM GPIO pin connected to the sensor (PIR OUT or LD2410 OUT pin)
gpio_pin = 17

# GPIO reading method: auto, gpiod, sysfs, or rpigpio
# auto: tries gpiod -> sysfs -> RPi.GPIO in order
gpio_method = auto

# GPIO chip device (used by gpiod method, typically gpiochip0 on RPi)
gpio_chip = gpiochip0

[display]
# Display control method: auto, backlight, or android
# auto: tries backlight -> android in order
# backlight: uses /sys/class/backlight (official RPi DSI touchscreen)
# android: uses input keyevent (emteriaOS)
method = auto

# Path to the sysfs backlight directory (used by backlight method)
backlight_path = /sys/class/backlight/rpi_backlight

[timing]
# Seconds to wait after last presence before turning off the display
timeout = 15

# Seconds between sensor reads
poll_interval = 0.5

# Seconds to ignore sensor after the display turns off.
# 0 is recommended for mmWave sensors (no false triggers like PIR).
# Increase for PIR sensors to suppress residual signals.
cooldown = 0

[logging]
# Log level: DEBUG, INFO, WARNING, ERROR
level = INFO
